                  fieldPath: metadata.name
            - name: NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range .Values.receive.extraEnv | default list }}
            - {{ toYaml . | nindent 14 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/thanos/receive
            - name: thanos-config
              mountPath: /etc/thanos
              readOnly: true
{{ include "thanos.extraMountItems" (dict "root" . "key" "receive") | nindent 12 }}
{{ include "thanos.containerSC" (dict "root" . "key" "receive") | nindent 10 }}
          resources:
{{ toYaml (.Values.receive.resources | default dict) | indent 12 }}
{{ include "thanos.httpProbes" (dict "root" . "key" "receive" "port" (default 10902 .Values.receive.service.httpPort)) | nindent 10 }}
      {{- with .Values.receive.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.receive.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.receive.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.receive.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with .Values.receive.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      volumes:
        - name: thanos-config
          projected:
            sources:
              - secret:
                  name: {{ .Values.global.objstore.secretName }}
                  items:
                    - key: {{ .Values.global.objstore.secretKey }}
                      path: objstore.yml
              - configMap:
                  name: {{ include "thanos.receive.hashringsConfigMapName" . }}
                  items:
                    - key: hashrings.json
                      path: hashrings.json
        {{- if not .Values.receive.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
{{ include "thanos.extraVolumeItems" (dict "root" . "key" "receive") | nindent 8 }}
