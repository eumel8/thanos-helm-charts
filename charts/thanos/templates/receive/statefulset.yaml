{{- if .Values.receive.enabled }}
{{- $shards := .Values.receive.shards | default list -}}
{{- $isMultiShard := gt (len $shards) 0 -}}

{{- if $isMultiShard }}
{{- /* Multi-shard mode: Create a StatefulSet for each shard */ -}}
{{- range $shard := $shards }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "thanos.receive.shardName" (list $ $shard.name) }}
  labels:
{{ include "thanos.labels" $ | indent 4 }}
    app.kubernetes.io/component: receive
    app.kubernetes.io/shard: {{ $shard.name }}
  annotations:
    {{- include "thanos.annotations" (dict "Values" $.Values "component" "receive") | nindent 4 }}
spec:
  serviceName: {{ include "thanos.receive.shardHeadless" (list $ $shard.name) }}
  replicas: {{ $shard.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: receive
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/shard: {{ $shard.name }}
  template:
    metadata:
      labels:
{{ include "thanos.labels" $ | indent 8 }}
        app.kubernetes.io/component: receive
        app.kubernetes.io/shard: {{ $shard.name }}
      annotations:
{{- $anns := dict -}}
{{- if $.Values.global.podAnnotations }}
{{- $anns = merge $anns $.Values.global.podAnnotations -}}
{{- end }}
{{- $_ := set $anns "checksum/hashrings" (include "thanos.receive.hashrings" $ | sha256sum) -}}
{{ toYaml $anns | nindent 8 }}
    spec:
      serviceAccountName: {{ include "thanos.serviceAccountName" $ }}
      {{ include "thanos.imagePullSecrets" $ | nindent 6 }}
      {{ include "thanos.podSC" (dict "root" $ "key" "receive") | nindent 6 }}
      containers:
        - name: receive
          image: "{{ $.Values.global.image.repository }}:{{ $.Values.global.image.tag }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          args:
            - receive
            - --http-address=0.0.0.0:{{ default 10902 $.Values.receive.service.httpPort }}
            - --grpc-address=0.0.0.0:{{ $.Values.receive.service.grpcPort }}
            - --remote-write.address=0.0.0.0:{{ $.Values.receive.service.remoteWritePort }}
            - --objstore.config-file=/etc/thanos/objstore.yml
            - --tsdb.path=/var/thanos/receive
            - --label=receive_replica="$(HOSTNAME)"
            - --label=receive_shard="{{ $shard.name }}"
            - --receive.hashrings-file=/etc/thanos/hashrings.json
            - --receive.hashrings-algorithm=ketama
            - --receive.local-endpoint=$(NAME).{{ include "thanos.receive.shardHeadless" (list $ $shard.name) }}.$(NAMESPACE).svc.{{ $.Values.global.clusterDomain }}:{{ $.Values.receive.service.grpcPort }}
            {{- if $.Values.receive.tenancyHeader }}
            - --receive.tenant-header={{ $.Values.receive.tenancyHeader }}
            {{- end }}
            {{- if $.Values.receive.tsdb.walCompression }}
            - --tsdb.wal-compression
            {{- end }}
            {{- range $.Values.receive.extraArgs }}
            - {{ . | quote }}
            {{- end }}
            {{- range $shard.extraArgs | default list }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: grpc
              containerPort: {{ $.Values.receive.service.grpcPort }}
            - name: http
              containerPort: {{ default 10902 $.Values.receive.service.httpPort }}
            - name: remote-write
              containerPort: {{ $.Values.receive.service.remoteWritePort }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- range $.Values.receive.extraEnv | default list }}
            - {{ toYaml . | nindent 14 }}
            {{- end }}
            {{- range $shard.extraEnv | default list }}
            - {{ toYaml . | nindent 14 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/thanos/receive
            - name: thanos-config
              mountPath: /etc/thanos
              readOnly: true
{{ include "thanos.extraMountItems" (dict "root" $ "key" "receive") | nindent 12 }}
{{ include "thanos.containerSC" (dict "root" $ "key" "receive") | nindent 10 }}
          resources:
{{ toYaml ($shard.resources | default $.Values.receive.resources | default dict) | indent 12 }}
{{ include "thanos.httpProbes" (dict "root" $ "key" "receive" "port" (default 10902 $.Values.receive.service.httpPort)) | nindent 10 }}
      {{- with $shard.nodeSelector | default $.Values.receive.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $shard.tolerations | default $.Values.receive.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $shard.affinity | default $.Values.receive.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $shard.topologySpreadConstraints | default $.Values.receive.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | indent 8 }}
      {{- end }}
      {{- with $shard.priorityClassName | default $.Values.receive.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      volumes:
        - name: thanos-config
          projected:
            sources:
              - secret:
                  name: {{ $shard.objstore.secretName }}
                  items:
                    - key: {{ $shard.objstore.secretKey | default "objstore.yml" }}
                      path: objstore.yml
              - configMap:
                  name: {{ include "thanos.receive.hashringsConfigMapName" $ }}
                  items:
                    - key: hashrings.json
                      path: hashrings.json
        {{- if not (dig "persistence" "enabled" $.Values.receive.persistence.enabled $shard) }}
        - name: data
          emptyDir: {}
        {{- end }}
{{ include "thanos.extraVolumeItems" (dict "root" $ "key" "receive") | nindent 8 }}
  {{- if dig "persistence" "enabled" $.Values.receive.persistence.enabled $shard }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          {{- range dig "persistence" "accessModes" $.Values.receive.persistence.accessModes $shard }}
          - {{ . }}
          {{- end }}
        {{- $storageClass := dig "persistence" "storageClass" $.Values.receive.persistence.storageClass $shard }}
        {{- if $storageClass }}
        storageClassName: {{ $storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ dig "persistence" "size" $.Values.receive.persistence.size $shard }}
  {{- end }}
{{- end }}
{{- else }}
{{- /* Legacy single-shard mode */ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "thanos.compName" (list . "receive") }}
  labels:
{{ include "thanos.labels" . | indent 4 }}
