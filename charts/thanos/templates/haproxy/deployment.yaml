{{- if .Values.haproxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "thanos.fullname" . }}-haproxy
spec:
  replicas: {{ .Values.haproxy.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "thanos.fullname" . }}-haproxy
  template:
    metadata:
      labels:
        app: {{ include "thanos.fullname" . }}-haproxy
    spec:
      containers:
        - name: haproxy
          image: "{{ .Values.haproxy.image.repository }}:{{ .Values.haproxy.image.tag }}"
          imagePullPolicy: {{ .Values.haproxy.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.haproxy.service.targetPort | default .Values.haproxy.service.port }}
              name: http
          resources:
{{ toYaml .Values.haproxy.resources | indent 12 }}
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
      volumes:
        - name: haproxy-config
          configMap:
            name: {{ include "thanos.fullname" . }}-haproxy
{{- end }}

